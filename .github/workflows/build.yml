name: Android Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        buildozer_version: master
        python_version: 3.11
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MiningApp-Package
        path: bin/*.apk
